name: Check and release

# Every change goes to the "dev" branch first.
#   On every push to dev:
#     1. check   - runs all automatic checks (tests/) in a real browser
#     2. preview - only if every check passed: publishes a test copy at
#                  https://slymnblk-dev.github.io/blitzit-desktop/  (the live app is untouched)
#   "Go live" (Actions -> Check and release -> Run workflow, go_live ticked):
#     1. check   - runs every check again
#     2. promote - moves dev to "main" (Netlify publishes "main" to windaday.com within a minute)
#     3. desktop - if the desktop app itself changed: builds and publishes the Windows update
# If a check fails, nothing goes live.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      go_live:
        description: Make the current dev version live on windaday.com
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: The live file must match the source files
        run: |
          npm run build:web
          git diff --exit-code web/index.html || (echo "::error::web/index.html is out of date - run npm run build:web and commit it" && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/
          retention-days: 7

  preview:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4

  promote:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.go_live && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: What changed since the live version?
        id: diff
        run: |
          git fetch origin main
          changed=$(git diff --name-only origin/main HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src-tauri/|RELEASE_NOTES.md$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Make it live (move dev to main)
        run: git push origin HEAD:main

  desktop:
    needs: promote
    if: needs.promote.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    secrets: inherit

name: Release Windows app

# Builds the signed Windows installer in the cloud and publishes it as a GitHub release.
# Installed Blitzit apps check the latest release and offer "Update now".
# It runs from the "Check and release" pipeline, only after every check has passed.
# To ship a desktop update: bump "version" in src-tauri/tauri.conf.json, update RELEASE_NOTES.md, push to dev.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - name: Check signing key
        shell: pwsh
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: if (-not $env:K) { echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing"; exit 1 } else { echo "::notice::Signing key found ($($env:K.Trim().Length) characters)" }
      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $body = Get-Content RELEASE_NOTES.md -Raw
          "body<<EOF`n$body`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Blitzit __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
      - name: Show build error
        if: failure()
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = (npm run tauri build 2>&1 | ForEach-Object { "$_" })
          $hits = $lines | Where-Object { $_ -match 'error|failed|invalid|panicked' } | Select-Object -First 8
          foreach ($l in $hits) { $m = $l -replace '::',' : '; echo "::error::$m" }
          $last = ($lines | Select-Object -Last 6) -join ' || '
          echo "::error::LAST: $($last -replace '::',' : ')"
          exit 1

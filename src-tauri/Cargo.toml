[package]
name = "blitzit"
version = "0.6.7"
description = "Windaday"
edition = "2021"

[lib]
name = "blitzit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Windows only: plays the splash sound through Windows itself (no browser autoplay rules)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media_Audio", "Win32_Foundation"] }

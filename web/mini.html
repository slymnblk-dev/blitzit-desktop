<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blitzit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Blitzit mini timer: a rounded card in a transparent, frameless, always-on-top window.
   The window has a little room around the card for its shadow, and a bit more on top
   so the hover controls can float on the card's top edge, just outside it. */
:root{--fbg:#FF5B47;--fink:#0F1013;--font:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--pt:24px;--p:12px}
html,body{margin:0;height:100%;background:transparent}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
.pv{position:absolute;top:var(--pt);left:var(--p);right:var(--p);bottom:var(--p);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;
  padding:16px 20px 18px;border-radius:24px;background:var(--fbg);color:var(--fink);cursor:grab;
  box-shadow:0 10px 28px -8px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.08);
  transition:background .6s,color .6s;animation:pvIn .42s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:100% 100%}
.pv:active{cursor:grabbing}
.pv.out{animation:pvOut .26s cubic-bezier(.4,0,.6,1) both}
@keyframes pvIn{from{opacity:0;transform:scale(.86) translateY(8px)}}
@keyframes pvOut{to{opacity:0;transform:scale(.9) translateY(6px)}}

/* task name: always visible, one line, never clipped */
.pv-h{display:flex;align-items:center;gap:10px;min-width:0}
.pv-t{flex:1;min-width:0;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82}
.pv-st{flex:none;display:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.14)}
.pv.paused .pv-st{display:block}
.pv-time{font-weight:800;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums;font-size:min(64px,19vw);margin-top:6px;white-space:nowrap;transition:opacity .25s}
.pv-bar{height:4px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:12px}
.pv-bar span{display:block;height:100%;width:0;background:currentColor;border-radius:4px;transition:width .9s linear}
.pv.paused .pv-time{opacity:.45}
.pv-wait{font-size:14px;font-weight:600;opacity:.8}

/* timer only */
[data-pipmode="mini"] .pv{align-items:center;padding:8px 14px;border-radius:22px}
[data-pipmode="mini"] .pv-h,[data-pipmode="mini"] .pv-bar{display:none}
[data-pipmode="mini"] .pv-time{font-size:min(56px,25vw);margin:0}

/* hover controls: a dark pill sitting on the card's top edge, half outside */
.pv-ctl{position:absolute;top:calc(var(--pt) - 20px);left:50%;z-index:2;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;
  background:var(--fink);color:var(--fbg);box-shadow:0 6px 16px -4px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
  opacity:0;transform:translate(-50%,6px) scale(.92);pointer-events:none;
  transition:opacity .18s ease,transform .26s cubic-bezier(.2,.9,.25,1.2),background .6s,color .6s}
body:hover .pv-ctl,.pv.paused~.pv-ctl{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pv-ctl button{height:26px;min-width:26px;padding:0;border:0;border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:800;
  display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .15s}
.pv-ctl button:hover{background:rgba(255,255,255,.12)}
.pv-ctl button:active{transform:scale(.9)}
.pv-ctl .pv-done{padding:0 12px;background:var(--fbg);color:var(--fink)}
.pv-ctl .pv-done:hover{background:var(--fbg);filter:brightness(1.08)}
.pv-ctl svg{width:13px;height:13px}
.pv-ctl i{width:1px;height:14px;background:currentColor;opacity:.2;margin:0 2px}

/* dark focus colours: the pill turns light so it still stands out */
[data-focusdark="1"] .pv-ctl{background:#F3F2EE;color:#0F1013}
[data-focusdark="1"] .pv-ctl button:hover{background:rgba(0,0,0,.08)}
[data-focusdark="1"] .pv-ctl .pv-done{background:#0F1013;color:#F3F2EE}
[data-focusdark="1"] .pv-bar,[data-focusdark="1"] .pv-st{background:rgba(255,255,255,.14)}
[data-focusdark="1"] .pv{box-shadow:0 10px 28px -8px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="pv" id="pv" data-tauri-drag-region>
  <div class="pv-h" data-tauri-drag-region><div class="pv-t" id="pvT" data-tauri-drag-region></div><span class="pv-st" data-tauri-drag-region>Paused</span></div>
  <div class="pv-time" id="pvTime" data-tauri-drag-region><span class="pv-wait">Waiting for Blitzit…</span></div>
  <div class="pv-bar" data-tauri-drag-region><span id="pvBar"></span></div>
</div>
<div class="pv-ctl" id="pvCtl">
  <button id="pvPlay" data-pv="play" aria-label="Pause" title="Pause (Space)"></button>
  <button class="pv-done" id="pvDone" data-pv="done" title="Done (Enter)">Done</button>
  <i></i>
  <button data-pv="size" id="pvSize" aria-label="Switch size"></button>
  <button data-pv="back" aria-label="Open Blitzit" title="Open Blitzit (double-click)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
</div>
<script>
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
const SHOW_TASK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M7.5 10h9M7.5 14h5"/></svg>';
const TIMER_ONLY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5.5" y="8" width="13" height="8" rx="2.5"/></svg>';
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__&&window.__TAURI__.event;
const send=a=>{if(TAURI)window.__TAURI__.event.emit('blitzit-act',a).catch(()=>{})};
if(!TAURI)$('pvTime').innerHTML='<span class="pv-wait">Open this from the Blitzit desktop app.</span>';
function render(st){
  const r=document.documentElement,mini=st.mode==='mini';
  r.dataset.pipmode=mini?'mini':'compact';
  if(st.vars){r.style.setProperty('--fbg',st.vars.fbg);r.style.setProperty('--fink',st.vars.fink);if(st.vars.font)r.style.setProperty('--font',st.vars.font);r.dataset.focusdark=st.vars.dark?'1':'0'}
  $('pvT').textContent=st.title||'';$('pvT').title=st.title||'';$('pvTime').textContent=st.time||'';
  $('pvBar').style.width=Math.min(100,st.bar||0)+'%';
  $('pv').classList.toggle('paused',!st.run&&!st.end&&!st.pick);
  $('pvPlay').innerHTML=st.run?PAUSE:PLAY;$('pvPlay').title=st.run?'Pause (Space)':st.pick?'Begin':'Resume (Space)';
  $('pvDone').textContent=st.pick?'Begin':'Done';
  $('pvSize').innerHTML=mini?SHOW_TASK:TIMER_ONLY;$('pvSize').title=mini?'Show task name':'Timer only';
}
if(TAURI){
  window.__TAURI__.event.listen('blitzit-state',e=>render(e.payload));
  send('ready');
  window.addEventListener('beforeunload',()=>send('closed'));
}
const back=()=>{$('pv').classList.add('out');setTimeout(()=>send('back'),220)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-pv]');if(!b)return;
  if(b.dataset.pv==='back')return back();
  send(b.dataset.pv)});
$('pv').addEventListener('dblclick',back);
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();send('play')}
  else if(e.key==='Enter'){e.preventDefault();send('done')}
  else if(e.key==='Escape'){e.preventDefault();back()}
});
</script>
</body>
</html>

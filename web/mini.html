<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blitzit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Blitzit mini timer: a rounded card floating in a transparent, frameless, always-on-top window.
   The window is a little bigger than the card so the soft shadow has room. */
:root{--fbg:#FF5B47;--fink:#0F1013;--font:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--pad:14px}
html,body{margin:0;height:100%;background:transparent}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
.pv{position:absolute;inset:var(--pad);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:16px 20px;
  border-radius:24px;background:var(--fbg);color:var(--fink);cursor:grab;
  box-shadow:0 10px 30px -6px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08);
  transition:background .6s,color .6s;animation:pvIn .42s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:100% 100%}
.pv.out{animation:pvOut .26s cubic-bezier(.4,0,.6,1) both}
@keyframes pvIn{from{opacity:0;transform:scale(.86) translateY(8px)}}
@keyframes pvOut{to{opacity:0;transform:scale(.9) translateY(6px)}}
.pv-t{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;opacity:.8;padding-right:4px}
.pv-time{font-weight:800;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;font-size:clamp(40px,22vw,110px);margin-top:4px;white-space:nowrap;transition:opacity .2s}
.pv-bar{height:4px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:12px}
.pv-bar span{display:block;height:100%;width:0;background:currentColor;border-radius:4px;transition:width .9s linear}
.pv.paused .pv-time{opacity:.4}
.pv-wait{font-size:14px;font-weight:600;opacity:.8}
[data-pipmode="mini"] .pv{align-items:center;padding:8px 14px;border-radius:22px}
[data-pipmode="mini"] .pv-t,[data-pipmode="mini"] .pv-bar{display:none}
[data-pipmode="mini"] .pv-time{font-size:clamp(30px,26vw,120px);margin:0}
[data-pipmode="mini"] body:hover .pv-time{opacity:.1}
.pv-ctl{position:absolute;right:12px;top:12px;display:flex;gap:4px;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s}
body:hover .pv-ctl,.pv.paused .pv-ctl{opacity:1;transform:none}
body:hover .pv-t{opacity:0}
[data-pipmode="mini"] .pv-ctl{left:8px;right:8px;top:50%;transform:translateY(-50%);justify-content:center}
.pv-ctl button{height:28px;min-width:28px;padding:0 10px;border:0;border-radius:999px;background:rgba(0,0,0,.14);color:inherit;font:inherit;font-size:12px;font-weight:700;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .15s}
.pv-ctl button:hover{background:rgba(0,0,0,.24)}
.pv-ctl button:active{transform:scale(.92)}
.pv-ctl .pv-done,.pv-ctl .pv-done:hover{background:var(--fink);color:var(--fbg)}
.pv-ctl .pv-done:hover{opacity:.88}
.pv-ctl svg{width:13px;height:13px}
[data-focusdark="1"] .pv-ctl button:not(.pv-done),[data-focusdark="1"] .pv-bar{background:rgba(255,255,255,.14)}
[data-focusdark="1"] .pv{box-shadow:0 10px 30px -6px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="pv" id="pv" data-tauri-drag-region>
  <div class="pv-t" id="pvT" data-tauri-drag-region></div>
  <div class="pv-time" id="pvTime" data-tauri-drag-region><span class="pv-wait">Waiting for Blitzit…</span></div>
  <div class="pv-bar" data-tauri-drag-region><span id="pvBar"></span></div>
  <div class="pv-ctl">
    <button id="pvPlay" data-pv="play" aria-label="Pause"></button>
    <button class="pv-done" id="pvDone" data-pv="done">Done</button>
    <button data-pv="size" aria-label="Switch size" title="Compact / timer only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
    <button data-pv="back" aria-label="Close mini timer" title="Close mini timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
<script>
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__&&window.__TAURI__.event;
const send=a=>{if(TAURI)window.__TAURI__.event.emit('blitzit-act',a).catch(()=>{})};
if(!TAURI)$('pvTime').innerHTML='<span class="pv-wait">Open this from the Blitzit desktop app.</span>';
function render(st){
  const r=document.documentElement;
  r.dataset.pipmode=st.mode==='mini'?'mini':'compact';
  if(st.vars){r.style.setProperty('--fbg',st.vars.fbg);r.style.setProperty('--fink',st.vars.fink);if(st.vars.font)r.style.setProperty('--font',st.vars.font);r.dataset.focusdark=st.vars.dark?'1':'0'}
  $('pvT').textContent=st.title||'';$('pvTime').textContent=st.time||'';
  $('pvBar').style.width=Math.min(100,st.bar||0)+'%';
  $('pv').classList.toggle('paused',!st.run&&!st.end);
  $('pvPlay').innerHTML=st.run?PAUSE:PLAY;$('pvPlay').setAttribute('aria-label',st.run?'Pause':st.pick?'Begin':'Resume');
  $('pvDone').textContent=st.pick?'Begin':'Done';
}
if(TAURI){
  window.__TAURI__.event.listen('blitzit-state',e=>render(e.payload));
  send('ready');
  window.addEventListener('beforeunload',()=>send('closed'));
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pv]');if(!b)return;
  if(b.dataset.pv==='back'){$('pv').classList.add('out');setTimeout(()=>send('back'),220);return}
  send(b.dataset.pv)});
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();send('play')}
  else if(e.key==='Enter'){e.preventDefault();send('done')}
  else if(e.key==='Escape'){e.preventDefault();$('pv').classList.add('out');setTimeout(()=>send('back'),220)}
});
</script>
</body>
</html>
